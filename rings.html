<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Try-On v19 (Occlusion + Rotation)</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        #input_video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 0;
        }
        #output_canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1; pointer-events: none;
        }
        #ui-container {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 10; gap: 20px;
        }
        .arrow-btn {
            background: rgba(255, 255, 255, 0.9); border: none; border-radius: 50%;
            width: 60px; height: 60px; font-size: 30px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #loading-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 16px; z-index: 5; 
            background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 30px;
            text-align: center; pointer-events: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/examples/": "https://unpkg.com/three@0.128.0/examples/"
            }
        }
    </script>
</head>
<body>

    <div id="loading-text">Kamera başlatılıyor...<br>Elini göster (Покажи руку)</div>
    <video id="input_video" playsinline muted autoplay></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-container">
        <button class="arrow-btn" id="prev-btn">◀</button>
        <button class="arrow-btn" id="next-btn">▶</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
        import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';

        const models = ['ring_01.glb', 'ring_02.glb', 'ring_03.glb'];
        
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const loadingText = document.getElementById('loading-text');

        let currentModelIndex = 0;
        let currentRing = null;

        // --- НАСТРОЙКИ ПОЗИЦИИ И ПОВОРОТА ---
        const OFFSET_Y = 0.45;  // Подняли еще чуть выше
        const OFFSET_X = 0.05; 
        
        // Поворот по оси Z (вокруг самого пальца). 
        // Если кольцо смотрит камнем вбок, меняйте это значение (в радианах).
        // 0.1 = немного повернуть, Math.PI = развернуть на 180 градусов.
        const ROTATION_Z_OFFSET = 0.0; 

        // Scene
        const scene = new THREE.Scene();
        const camera3D = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera3D.position.z = 2;

        const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        // Lights & Environment
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(0, 5, 5);
        scene.add(dirLight);

        // --- OCCLUDER (НЕВИДИМЫЙ ПАЛЕЦ) ---
        // Создаем цилиндр, который будет "маской" для пальца
        // colorWrite: false делает его невидимым, но он перекрывает объекты за собой
        const occlusionGeo = new THREE.CylinderGeometry(1.1, 1.1, 5, 32);
        const occlusionMat = new THREE.MeshBasicMaterial({ colorWrite: false }); 
        const occluder = new THREE.Mesh(occlusionGeo, occlusionMat);
        
        // Важно: renderOrder. Окклюдер рисуется первым (0), кольцо вторым (1).
        occluder.renderOrder = 0; 
        scene.add(occluder);

        // Loader
        const loader = new GLTFLoader();

        function loadRing(index) {
            if (currentRing) { scene.remove(currentRing); currentRing = null; }

            loader.load(models[index], (gltf) => {
                currentRing = gltf.scene;
                currentRing.scale.set(10, 10, 10); 
                currentRing.renderOrder = 1; // Рисуем ПОСЛЕ окклюдера
                scene.add(currentRing);
            }, undefined, (error) => {
                console.log("Fallback placeholder");
                const geo = new THREE.TorusGeometry(0.12, 0.02, 16, 32);
                const mat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 1.0, roughness: 0.1 });
                currentRing = new THREE.Mesh(geo, mat);
                currentRing.rotation.x = Math.PI / 2;
                currentRing.renderOrder = 1;
                scene.add(currentRing);
            });
        }

        loadRing(0);

        // MediaPipe
        const hands = new window.Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        let textHidden = false;

        hands.onResults((results) => {
            renderer.clear();
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                if (!textHidden) {
                    loadingText.style.display = 'none';
                    textHidden = true;
                }
                
                const landmarks = results.multiHandLandmarks[0];
                
                // СРЕДНИЙ ПАЛЕЦ
                const pBase = landmarks[9]; 
                const pJoint = landmarks[10]; 

                if (currentRing) {
                    // Координаты
                    const x = (pBase.x + pJoint.x) / 2;
                    const y = (pBase.y + pJoint.y) / 2;

                    let screenX = (x - 0.5) * 10 + OFFSET_X; 
                    let screenY = -(y - 0.5) * 10 + OFFSET_Y;
                    const screenZ = -6;
                    
                    // Позиция кольца
                    currentRing.position.set(screenX, screenY, screenZ);

                    // Позиция окклюдера (невидимого пальца) - та же, что и у кольца
                    occluder.position.copy(currentRing.position);
                    
                    // Масштаб окклюдера (чуть подгоняем под кольцо, чтобы он был внутри)
                    // Масштаб кольца 10, радиус окклюдера 1.1 * 0.9 ~ 1.0. 
                    // Можно менять scale, чтобы сделать палец "толще" или "тоньше"
                    occluder.scale.set(0.9, 1, 0.9);

                    // Вращение
                    const dx = pJoint.x - pBase.x;
                    const dy = pJoint.y - pBase.y;
                    const angle = Math.atan2(dy, dx);
                    
                    // Основной поворот кольца и окклюдера (вдоль пальца)
                    const finalAngle = angle - Math.PI / 2;
                    currentRing.rotation.z = finalAngle + ROTATION_Z_OFFSET;
                    
                    // Окклюдер тоже поворачиваем так же, чтобы цилиндр совпал с пальцем
                    occluder.rotation.z = finalAngle; 
                    
                    // Наклон кольца (для красоты)
                    currentRing.rotation.x = 0.2;
                    // Окклюдер наклоняем так же, иначе он вылезет
                    occluder.rotation.x = 0.2; 
                }
            }
            renderer.render(scene, camera3D);
        });

        const camera = new window.Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720,
            facingMode: 'environment'
        });

        camera.start();

        document.getElementById('next-btn').onclick = () => {
            currentModelIndex = (currentModelIndex + 1) % models.length;
            loadRing(currentModelIndex);
        }

        document.getElementById('prev-btn').onclick = () => {
            currentModelIndex = (currentModelIndex - 1 + models.length) % models.length;
            loadRing(currentModelIndex);
        }

        window.addEventListener('resize', () => {
            camera3D.aspect = window.innerWidth / window.innerHeight;
            camera3D.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
